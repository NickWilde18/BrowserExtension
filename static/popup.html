<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1 data-i18n="popupTitle"></h1>

    <section id="intro" class="intro" hidden>
      <h2 data-i18n="introTitle"></h2>
      <ol>
        <li data-i18n="intro1"></li>
        <li data-i18n="intro2"></li>
        <li data-i18n="intro3"></li>
        <li data-i18n="intro4"></li>
        <li data-i18n="intro5"></li>
      </ol>
      <button id="introOk" type="button" data-i18n="introOk"></button>
    </section>

    <section class="status">
      <p id="state" class="state"></p>
      <p id="executionHint" class="hint" hidden></p>
      <p id="accountRow" hidden><span data-i18n="account"></span>：<span id="account"></span></p>
      <button id="reconnect" type="button" data-i18n="reconnect" hidden></button>
    </section>

    <section id="stoppedRow" class="stopped" hidden>
      <p data-i18n="stopped"></p>
      <button id="resume" type="button" data-i18n="resume"></button>
      <p class="hint" data-i18n="globalResumeHint"></p>
    </section>

    <section>
      <label for="displayName" data-i18n="displayName"></label>
      <div class="row">
        <input id="displayName" type="text" maxlength="64">
        <button id="saveName" type="button" data-i18n="save"></button>
      </div>
      <p class="hint" data-i18n="displayNameHint"></p>
    </section>

    <section>
      <label class="switch"><input id="autoMode" type="checkbox"> <span data-i18n="autoMode"></span></label>
      <p class="hint" data-i18n="autoModeHint"></p>
    </section>

    <section>
      <button id="share" type="button" data-i18n="share"></button>
      <p id="shareTarget" class="hint"></p>
      <p id="sharedRow" hidden><span data-i18n="shared"></span> <button id="unshare" type="button" data-i18n="unshare"></button></p>
      <p id="shareNote" class="hint" data-i18n="shareHint"></p>
      <button id="showControls" type="button" data-i18n="showControls" hidden></button>
      <p id="controlsHint" class="hint" data-i18n="controlsHint" hidden></p>
      <p id="controlsError" class="hint" role="status" hidden></p>
    </section>

    <section>
      <button id="stop" type="button" class="danger" data-i18n="stop"></button>
      <p class="hint" data-i18n="stopHint"></p>
    </section>

    <section id="controlledSection" hidden>
      <h2 data-i18n="controlledConversations"></h2>
      <ul id="controlledConversations"></ul>
      <p class="hint" data-i18n="controlledHint"></p>
    </section>

    <section>
      <h2 data-i18n="sites"></h2>
      <ul id="sites"></ul>
      <p id="sitesNone" class="hint" data-i18n="sitesNone"></p>
    </section>

    <details id="advanced" class="advanced">
      <summary data-i18n="advancedSettings"></summary>
      <label for="serverOrigin" data-i18n="serverOriginLabel"></label>
      <input id="serverOrigin" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="serverOriginHint serverSwitchHint serverPermissionHint serverError">
      <p id="serverOriginHint" class="hint" data-i18n="serverOriginHint"></p>
      <p id="serverSwitchHint" class="hint" data-i18n="serverSwitchHint"></p>
      <p id="serverPermissionHint" class="hint" data-i18n="serverPermissionHint" hidden></p>
      <button id="saveServer" type="button" data-i18n="saveServer" disabled></button>
      <p id="serverError" class="hint" role="status" aria-live="polite" hidden></p>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
